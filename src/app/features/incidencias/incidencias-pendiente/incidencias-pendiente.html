<div class="contenedor">

  <div class="cabecera">

    <h2>
      Incidencias pendientes
    </h2>

    <button
      mat-raised-button
      color="primary"
      (click)="nuevoPendiente()">

      Nuevo pendiente

    </button>

  </div>

  <table
    mat-table
    [dataSource]="incidencias">

    <ng-container matColumnDef="fecha">

      <th mat-header-cell *matHeaderCellDef>
        Fecha
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.fecha | date:'dd/MM/yyyy HH:mm' }}
      </td>

    </ng-container>

    <ng-container matColumnDef="usuario">

      <th mat-header-cell *matHeaderCellDef>
        Usuario
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.usuario }}
      </td>

    </ng-container>

    <ng-container matColumnDef="cliente">

      <th mat-header-cell *matHeaderCellDef>
        Cliente
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.cliente }}
      </td>

    </ng-container>

    <ng-container matColumnDef="asistencia">

      <th mat-header-cell *matHeaderCellDef>
        Asistencia
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.asistencia }}
      </td>

    </ng-container>

    <ng-container matColumnDef="incidencia">

      <th mat-header-cell *matHeaderCellDef>
        Incidencia
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.incidencia }}
      </td>

    </ng-container>

    <ng-container matColumnDef="guardia">

      <th mat-header-cell *matHeaderCellDef>
        Guardia
      </th>

      <td mat-cell *matCellDef="let item">

        {{ item.guardia ? 'Sí' : 'No' }}

      </td>

    </ng-container>

    <ng-container matColumnDef="accion">

      <th mat-header-cell *matHeaderCellDef>
        Acción
      </th>

      <td mat-cell *matCellDef="let item">

        <button
          mat-raised-button
          color="accent"
          (click)="finalizar(item)">
          Finalizar
        </button>

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</div>
