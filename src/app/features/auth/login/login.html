<div class="login-page">

    <div class="login-overlay"></div>

    <mat-card class="login-card">

        <mat-card-header class="login-header">

            <mat-card-title>
                Sistema Técnico
            </mat-card-title>

            <mat-card-subtitle>
                Iniciar sesión
            </mat-card-subtitle>

        </mat-card-header>


        <mat-card-content>

            <form
                [formGroup]="form"
                (ngSubmit)="login()"
                class="login-form">


                <!-- USUARIO -->

                <mat-form-field
                    appearance="outline"
                    class="w-100">

                    <mat-label>
                        Usuario
                    </mat-label>

                    <mat-icon matPrefix>
                        person
                    </mat-icon>

                    <input
                        matInput
                        formControlName="userName"
                        autocomplete="username">

                </mat-form-field>


                <!-- CONTRASEÑA -->

                <mat-form-field
                    appearance="outline"
                    class="w-100">

                    <mat-label>
                        Contraseña
                    </mat-label>

                    <mat-icon matPrefix>
                        lock
                    </mat-icon>

                    <input
                        matInput
                        type="password"
                        formControlName="password"
                        autocomplete="current-password">

                </mat-form-field>


                <!-- ERROR -->

                @if (error) {

                    <div class="login-error">

                        <mat-icon>
                            error
                        </mat-icon>

                        <span>
                            {{ error }}
                        </span>

                    </div>

                }


                <!-- BOTÓN -->

                <button
                    mat-raised-button
                    color="primary"
                    type="submit"
                    class="login-button"
                    [disabled]="form.invalid">

                    <mat-icon>
                        login
                    </mat-icon>

                    Ingresar

                </button>


            </form>

        </mat-card-content>


        <mat-card-footer class="login-footer">

            Sistema Técnico

        </mat-card-footer>

    </mat-card>

</div>
